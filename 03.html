<!DOCTYPE html>
<html>
    <head>
        <title>Formatting in HTML</title>
    
    </head>
    <body>
        <h1>What is HTML?</h1>
        <br>
        <p>HTML stands for Hyper Text Markup Language</p>
        <br>
        <h2>Uses of HTML</h2>
        <br>
        <b>HTML bold tag</b>
        <br>
        <strong>HTML Strong tag</strong>
        <br>
        <i>HTML italic tag</i>
        <br>
        <u>HTML underline tag</u>
        <br>
        <p>i would like to have a cup of <strike>coffee</strike> tea</p>
        <p>i would like to have a cup of <del>coffee</del> tea</p>
        <p>i would like to have a cup of <mark>coffee</mark> </p>
        <p>i prefer <font size="6" color="red" face="verdana"> sky</font></p>
    </body>
</html>
